name: Playwright Tests

on:
  push:
    branches: [playwright]
  pull_request:
    branches: [playwright]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Initialize Convex for CI
        run: |
          # Create .env.local without CONVEX_DEPLOYMENT to run in ephemeral mode
          # This prevents Convex from prompting for authentication in CI
          echo "NEXT_PUBLIC_CONVEX_URL=http://127.0.0.1:3210" > .env.local
          echo "NEXT_PUBLIC_CONVEX_SITE_URL=http://127.0.0.1:3211" >> .env.local

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-videos
          path: test-results/
          retention-days: 7

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: daun/playwright-report-comment@v3
        with:
          report-path: playwright-report
          report-url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Test Summary
        if: always()
        run: |
          echo "## Playwright Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f playwright-report/index.html ]; then
            echo "✅ Test report generated successfully" >> $GITHUB_STEP_SUMMARY
            echo "View the full report in the artifacts section" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Test report not found" >> $GITHUB_STEP_SUMMARY
          fi
